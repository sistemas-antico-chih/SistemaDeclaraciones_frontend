<h2 mat-dialog-title>Confirmar registro</h2>

<mat-dialog-content>

  <p>
    Para registrar la nota aclaratoria debe ingresar
    su contraseña de inicio de sesión.
  </p>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Contraseña</mat-label>

    <input
      matInput
      type="password"
      [(ngModel)]="password"
      autocomplete="current-password"
      (keyup.enter)="confirmar()"
    />

  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancelar()">
    Cancelar
  </button>

  <button
    mat-raised-button
    color="primary"
    [disabled]="!password"
    (click)="confirmar()">
    Firmar y guardar
  </button>

</mat-dialog-actions>
